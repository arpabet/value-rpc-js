name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # The vrpc conformance suite runs the real Go value-rpc server
      # (conformance/server); without Go on the path it is skipped.
      - name: Set up Go (conformance server)
        uses: actions/setup-go@v6
        with:
          go-version-file: conformance/server/go.mod
          cache-dependency-path: conformance/server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck all workspaces
        run: npm run typecheck

      - name: Test all workspaces
        run: npm test
