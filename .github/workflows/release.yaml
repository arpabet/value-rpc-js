name: Release

# Publishes all publishable workspace packages to npm in one run.
# Trigger: push a version tag (v0.2.0) — or run manually from the Actions UI
# (a workflow_dispatch from main publishes the versions main declares).
# Already-published versions are skipped, so the workflow is safe to re-run
# after a partial failure.
#
# Auth, in order of preference:
#   1. npm trusted publishing (OIDC). Each package's settings on npmjs.com
#      name this repository and this workflow file (release.yaml) as a
#      trusted publisher. Needs `id-token: write` below and npm >= 11.5.1,
#      which Node 24 bundles. Provenance attestations are then generated
#      automatically (public repository, public packages).
#   2. Fallback: repo secret NPM_TOKEN, a granular access token with
#      read/write on the @arpabet packages and "bypass 2FA" enabled. npm
#      caps such tokens at 90 days, which is why OIDC is preferred.

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: read
  # Lets the job mint the OIDC token that npm exchanges for publish rights.
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          # Node 24 bundles npm 11.x; trusted publishing needs npm >= 11.5.1.
          node-version: 24
          cache: npm
          # Writes an .npmrc that authenticates via NODE_AUTH_TOKEN when set.
          registry-url: https://registry.npmjs.org

      # The vrpc conformance suite runs the real Go value-rpc server
      # (conformance/server, go.mod requires >= 1.25). The runner's
      # preinstalled Go is older, which fails `go run .` at startup.
      - name: Set up Go (conformance server)
        uses: actions/setup-go@v6
        with:
          go-version-file: conformance/server/go.mod
          cache-dependency-path: conformance/server/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

      - name: Test all workspaces
        run: npm test

      - name: Publish packages
        env:
          # Fallback only: ignored once the trusted-publisher exchange succeeds.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Dependency order: vrpc → vrpc-vue → vrpc-nuxt. Examples are
          # "private": true and can never be published.
          for pkg in packages/vrpc packages/vrpc-vue packages/vrpc-nuxt; do
            name=$(node -p "require('./$pkg/package.json').name")
            version=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "SKIP     $name@$version — already on the registry"
            else
              echo "PUBLISH  $name@$version"
              npm publish --workspace "$pkg"
            fi
          done
